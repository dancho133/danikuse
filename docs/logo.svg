<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" fill="none">
  <!--
    Danikuse Pro Hero Mark (logo-pro.svg)
    Elevated from docs/logo.svg: "a browser window with a terminal cursor breaking the frame = agent inside your browser"
    Palette:
      - Warm Editorial Ivory (#FAF6EF)
      - Espresso Structural Charcoal (#2A2320 / #1C1715)
      - Signature Burnt Terracotta (#B3401E / #D94E28)
      - Warm Stone Muted Accent (#78716C)
  -->
  <defs>
    <!-- Ambient Occlusion Shadow under Browser Window -->
    <filter id="window-ao" x="-15%" y="-10%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0C0A09" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2A2320" flood-opacity="0.18"/>
    </filter>

    <!-- Parallax Depth Shadow for Terracotta Execution Node Breaking the Frame -->
    <filter id="badge-breakout-ao" x="-30%" y="-25%" width="165%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-2" dy="4" stdDeviation="4.5" flood-color="#1C1715" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#B3401E" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Glyph Depth Shadow -->
    <filter id="glyph-depth" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#2A2320" flood-opacity="0.14"/>
    </filter>

    <!-- Warm Editorial Ivory Surface Gradient -->
    <linearGradient id="ivory-surface" x1="14" y1="26" x2="114" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>

    <!-- Browser Chrome Top Bar Subtle Sheen -->
    <linearGradient id="chrome-bar" x1="14" y1="26" x2="14" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F3EDE2" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Inner Rim Lighting Gradient -->
    <linearGradient id="inner-rim" x1="14" y1="26" x2="114" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FAF6EF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B3401E" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Signature Terracotta Execution Node Gradient -->
    <linearGradient id="terracotta-node" x1="76" y1="58" x2="104" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D94E28"/>
      <stop offset="60%" stop-color="#B3401E"/>
      <stop offset="100%" stop-color="#963215"/>
    </linearGradient>

    <!-- Terracotta Rim Highlight -->
    <linearGradient id="terracotta-rim" x1="76" y1="58" x2="104" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A65" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#2A2320" stop-opacity="0.25"/>
    </linearGradient>

    <clipPath id="window-clip">
      <rect x="14" y="26" width="100" height="78" rx="11"/>
    </clipPath>
  </defs>

  <!-- LAYER 1: Browser Window Base & Ambient Occlusion -->
  <g id="layer-browser-window" filter="url(#window-ao)">
    <rect x="14" y="26" width="100" height="78" rx="11" fill="url(#ivory-surface)"/>
    
    <!-- Clipped Interior Chrome & Grid Subtle Detail -->
    <g clip-path="url(#window-clip)">
      <!-- Top Chrome Bar Surface -->
      <rect x="14" y="26" width="100" height="20" fill="url(#chrome-bar)"/>
      <!-- Subtle Editorial Baseline Grid Hint -->
      <line x1="24" y1="60" x2="104" y2="60" stroke="#2A2320" stroke-width="0.5" stroke-opacity="0.05"/>
      <line x1="24" y1="74" x2="104" y2="74" stroke="#2A2320" stroke-width="0.5" stroke-opacity="0.05"/>
      <line x1="24" y1="88" x2="104" y2="88" stroke="#2A2320" stroke-width="0.5" stroke-opacity="0.05"/>
    </g>

    <!-- Inner 1px Specular Rim Highlight -->
    <rect x="17" y="29" width="94" height="72" rx="8.5" stroke="url(#inner-rim)" stroke-width="1.2"/>

    <!-- Structural Outer Frame (#2A2320) -->
    <rect x="14" y="26" width="100" height="78" rx="11" stroke="#2A2320" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- LAYER 2: Browser Chrome Header & Traffic Controls -->
  <g id="layer-browser-chrome">
    <!-- Structural Divider Line -->
    <line x1="14" y1="46" x2="114" y2="46" stroke="#2A2320" stroke-width="5" stroke-linecap="butt"/>
    <line x1="16.5" y1="48.5" x2="111.5" y2="48.5" stroke="#2A2320" stroke-width="0.75" stroke-opacity="0.12"/>

    <!-- Active Agent Traffic Node (Terracotta) with Optical Ring -->
    <circle cx="26" cy="36" r="4.6" stroke="#B3401E" stroke-width="0.8" stroke-opacity="0.35"/>
    <circle cx="26" cy="36" r="3.4" fill="#B3401E"/>
    <circle cx="25" cy="35" r="1" fill="#FAF6EF" fill-opacity="0.55"/>

    <!-- Secondary Muted Chrome Nodes -->
    <circle cx="38" cy="36" r="3.4" fill="#2A2320" fill-opacity="0.35"/>
    <circle cx="50" cy="36" r="3.4" fill="#2A2320" fill-opacity="0.35"/>

    <!-- Subtle Address Bar Pill Capsule -->
    <rect x="62" y="33" width="40" height="6" rx="3" fill="#2A2320" fill-opacity="0.08"/>
  </g>

  <!-- LAYER 3: Precision Vector Terminal Prompt `>_` -->
  <g id="layer-terminal-glyph" filter="url(#glyph-depth)">
    <!-- `>` Chevron (Precision Geometric Path) -->
    <path
      id="glyph-chevron"
      d="M27.5 64.5L39.5 72.5L27.5 80.5"
      stroke="#2A2320"
      stroke-width="5.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- `_` Active Underscore Cursor -->
    <rect
      id="glyph-underscore"
      x="44.5"
      y="79.5"
      width="17"
      height="5.2"
      rx="2.4"
      fill="#2A2320"
    />
  </g>

  <!-- LAYER 4: Terracotta Execution Node Breaking Frame Plane -->
  <g id="layer-execution-badge">
    <!-- Subtle Optical Target Reticle Behind Node -->
    <rect
      x="74.5"
      y="56.5"
      width="33"
      height="33"
      rx="8.5"
      stroke="#B3401E"
      stroke-width="1"
      stroke-opacity="0.28"
      stroke-dasharray="3 2"
    />
    <!-- Elevated Terracotta Execution Badge (Breaking the right visual plane) -->
    <g filter="url(#badge-breakout-ao)">
      <rect x="77" y="59" width="28" height="28" rx="6.5" fill="url(#terracotta-node)"/>
      <rect x="77.75" y="59.75" width="26.5" height="26.5" rx="5.75" stroke="url(#terracotta-rim)" stroke-width="1.2"/>
      <rect x="77" y="59" width="28" height="28" rx="6.5" stroke="#2A2320" stroke-width="2.2"/>
      <!-- Precision Optical Play / Execute Vector Glyph -->
      <path
        id="badge-play-glyph"
        d="M87.5 67.8L96.2 73L87.5 78.2V67.8Z"
        fill="#FAF6EF"
        stroke="#FAF6EF"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
